{% extends "base.html" %}
{% block title %}Teacher · Statistically Speaking{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Teacher</h1>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ request.url_for('admin_login') }}">
    <div class="field">
      <label for="teacher_name">Your name</label>
      <input type="text" id="teacher_name" name="teacher_name" maxlength="60" required
             {% if request.state.ecosystem_account and request.state.ecosystem_account.kind == 'google' %}value="{{ request.state.ecosystem_account.name }}" readonly{% endif %}>
    </div>
    <button type="submit" class="btn btn-primary btn-large btn-block">Open the dashboard</button>
  </form>
</article>
{% endblock %}
