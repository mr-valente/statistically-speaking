# Standalone development only. For production prefix/TLS integration use Athenaeum.
services:
  statistically-speaking:
    build: .
    environment:
      APP_ENV: development
      SESSION_SECRET: ${SESSION_SECRET:?Set a stable local session secret}
    ports:
      - '${BIND_HOST:-127.0.0.1}:8000:8000'
    volumes:
      - statistically_speaking_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  statistically_speaking_data:
